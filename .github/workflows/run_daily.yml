name: Trigger Streamlit Webhook 4x Daily

on:
  schedule:
    # 1. 01:25 שעון ישראל (22:25 UTC) - תמיד VS כי השוק סגור
    - cron: '25 22 * * *'
    # 2. 15:14 שעון ישראל (12:14 UTC) - כל יום (ביום ראשון מריץ weekly_summery)
    - cron: '14 12 * * *'
    # 3. 19:25 שעון ישראל (16:25 UTC) - כל יום
    - cron: '25 16 * * *'
    # 4. 23:21 שעון ישראל (20:21 UTC) - כל יום
    - cron: '21 20 * * *'

  workflow_dispatch:
    inputs:
      video_type:
        description: 'בחר סוג סרטון להרצה ידנית'
        required: true
        default: 'vs_video'
        type: choice
        options:
          - vs_video
          - update_video
          - weekly_summery

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium
      - name: Trigger Streamlit App
        run: |
          python -c "
          import os
          import time
          from datetime import datetime, time as dtime
          from zoneinfo import ZoneInfo
          from playwright.sync_api import sync_playwright

          # 1. בדיקה אם יש אינפוט מהפעלה ידנית
          manual_input = '${{ github.event.inputs.video_type }}'
          if manual_input:
              video_type = manual_input
          else:
              # 2. בדיקת זמנים לפי שעון ישראל ושעון ניו יורק
              now_il = datetime.now(ZoneInfo('Asia/Jerusalem'))
              now_et = datetime.now(ZoneInfo('America/New_York'))
              
              is_sunday = now_il.weekday() == 6  # 6 = יום ראשון
              is_afternoon_run = 15 <= now_il.hour < 16  # עכשיו יתפוס בהרצת 15:14!

              # אם זה יום ראשון בהרצה של אחה\"צ -> סרטון סיכום שבועי
              if is_sunday and is_afternoon_run:
                  video_type = 'weekly_summery'
              else:
                  # בדיקת סטטוס מסחר רגיל לפי שעון ניו יורק
                  is_weekend = now_et.weekday() >= 5  # 5 = שבת, 6 = ראשון
                  is_trading_hours = dtime(9, 30) <= now_et.time() < dtime(16, 0)
                  is_market_open = (not is_weekend) and is_trading_hours

                  if not is_market_open:
                      video_type = 'vs_video'
                  else:
                      video_type = 'update_video'

          url = f'https://slack-ai-agent-xt3nrfdfzjxsupyxdlncnm.streamlit.app/?WEBHOOK_TOKEN=${{ secrets.WEBHOOK_TOKEN }}&video_type={video_type}'
          print(f'🚀 Opening {url} (Type: {video_type}) in Headless Chrome...')
          
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(url)
              time.sleep(15)
              print(f'✅ Page triggered successfully for {video_type}!')
          "
