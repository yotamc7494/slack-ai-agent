name: Trigger Streamlit Webhook 2x Daily

on:
  schedule:
    # 1. 12:14 UTC (08:14 EDT / 07:14 EST) - בוקר: ימי ראשון עד שישי (0=ראשון, 1-5=שני עד שישי)
    - cron: '14 12 * * 0-5'
    # 2. 21:21 UTC (17:21 EDT / 16:21 EST) - סגירת מסחר: ימי שני עד שישי בלבד
    - cron: '21 21 * * 1-5'

  workflow_dispatch:
    inputs:
      video_type:
        description: 'בחר סוג סרטון להרצה ידנית'
        required: true
        default: 'vs_video'
        type: choice
        options:
          - vs_video
          - update_video
          - weekly_summary

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Trigger Streamlit App
        env:
          MANUAL_VIDEO_TYPE: ${{ github.event.inputs.video_type }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          python -c "
          import os
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from playwright.sync_api import sync_playwright

          manual_input = os.environ.get('MANUAL_VIDEO_TYPE', '').strip()

          if manual_input:
              video_type = manual_input
          else:
              now_et = datetime.now(ZoneInfo('America/New_York'))
              weekday = now_et.weekday()  # 0=Monday, ..., 4=Friday, 5=Saturday, 6=Sunday
              is_morning = now_et.hour < 12

              if weekday == 6 and is_morning:
                  # יום ראשון בבוקר (בשעת פתיחת המסחר המשוערת) -> weekly_summary
                  video_type = 'weekly_summary'
              elif weekday < 5 and is_morning:
                  # יום מסחר בבוקר (שני עד שישי) -> vs_video
                  video_type = 'vs_video'
              elif weekday < 5 and not is_morning:
                  # יום מסחר בסוף היום (שני עד שישי) -> update_video
                  video_type = 'update_video'
              else:
                  # ברירת מחדל למקרים חריגים (כמו הרצה בשבת)
                  video_type = 'vs_video'

          token = os.environ.get('WEBHOOK_TOKEN', '')
          url = f'https://slack-ai-agent-xt3nrfdfzjxsupyxdlncnm.streamlit.app/?WEBHOOK_TOKEN={token}&video_type={video_type}'
          print(f'🚀 Opening {url} (Type: {video_type}) in Headless Chrome...')

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(url)
              time.sleep(15)
              print(f'✅ Page triggered successfully for {video_type}!')
          "
