name: Trigger Streamlit Webhook 4x Daily

on:
  schedule:
    # 1. 22:25 UTC -> 01:25 ישראל (18:25 EDT) - VS
    - cron: '25 22 * * *'
    # 2. 12:14 UTC -> 15:14 ישראל (08:14 EDT) - בוקר (ביום ראשון: weekly_summery, בשאר הימים: VS)
    - cron: '14 12 * * *'
    # 3. 17:25 UTC -> 20:25 ישראל (13:25 EDT) - VS
    - cron: '25 17 * * *'
    # 4. 21:21 UTC -> 00:21 ישראל (17:21 EDT) - VS
    - cron: '21 21 * * *'

  workflow_dispatch:
    inputs:
      video_type:
        description: 'בחר סוג סרטון להרצה ידנית'
        required: true
        default: 'vs_video'
        type: choice
        options:
          - vs_video
          - weekly_summery

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium
      - name: Trigger Streamlit App
        run: |
          python -c "
          import os
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from playwright.sync_api import sync_playwright

          # 1. בדיקה אם יש אינפוט מהפעלה ידנית
          manual_input = '${{ github.event.inputs.video_type }}'
          if manual_input:
              video_type = manual_input
          else:
              # 2. בדיקת זמנים לפי שעון ניו יורק (ET)
              now_et = datetime.now(ZoneInfo('America/New_York'))

              is_sunday = now_et.weekday() == 6  # 6 = יום ראשון ב-NY
              is_morning_run = 6 <= now_et.hour <= 9  # תופס את הרצת 15:14 ישראל / 08:14 NY

              # אם זה יום ראשון בהרצת הבוקר -> סרטון סיכום שבועי, אחרת תמיד VS
              if is_sunday and is_morning_run:
                  video_type = 'weekly_summery'
              else:
                  video_type = 'vs_video'

          url = f'https://slack-ai-agent-xt3nrfdfzjxsupyxdlncnm.streamlit.app/?WEBHOOK_TOKEN=${{ secrets.WEBHOOK_TOKEN }}&video_type={video_type}'
          print(f'🚀 Opening {url} (Type: {video_type}) in Headless Chrome...')

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(url)
              time.sleep(15)
              print(f'✅ Page triggered successfully for {video_type}!')
          "
