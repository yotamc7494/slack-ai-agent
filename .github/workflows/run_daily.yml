name: Trigger Streamlit Webhook 3x Daily

on:
  schedule:
    # 1. 15:14 שעון ישראל (12:14 UTC) - עוקף את העומס של 12:00!
    - cron: '14 11 * * 1-5'
    
    # 2. 19:33 שעון ישראל (16:33 UTC)
    - cron: '33 15 * * 1-6'
    
    # 3. 23:22 שעון ישראל (20:22 UTC)
    - cron: '21 19 * * 1-6'

  workflow_dispatch:

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Trigger Streamlit App
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          import time

          url = 'https://slack-ai-agent-xt3nrfdfzjxsupyxdlncnm.streamlit.app/?WEBHOOK_TOKEN=${{ secrets.WEBHOOK_TOKEN }}'
          print(f'🚀 Opening {url} in Headless Chrome...')

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(url)
              # המתנה של 15 שניות כדי לוודא ש-Streamlit יצר את חיבור ה-WebSocket והתחיל את הרינדור
              time.sleep(15)
              print('✅ Page triggered successfully!')
          "
