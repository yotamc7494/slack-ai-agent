name: Trigger Streamlit Webhook 3x Daily

on:
  schedule:
    # 1. 15:00 שעון ישראל (12:00 UTC)
    - cron: '0 12 * * 1-5'
    
    # 2. 19:30 שעון ישראל (16:30 UTC)
    - cron: '30 16 * * 1-5'
    
    # 3. 23:30 שעון ישראל (20:30 UTC)
    - cron: '30 20 * * 1-5'

  workflow_dispatch: # הרצה ידנית בלחיצת כפתור

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Send Webhook to Streamlit
        run: |
          curl -s "https://slack-ai-agent-xt3nrfdfzjxsupyxdlncnm.streamlit.app/?token=${{ secrets.WEBHOOK_TOKEN }}"
