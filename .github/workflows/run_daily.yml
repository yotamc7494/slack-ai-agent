name: Trigger Streamlit Webhook 4x Daily

on:
  schedule:
    # 1. 12:14 UTC -> 08:14 EDT (15:14 ישראל) - בוקר (ביום ראשון: weekly_summery, בשאר הימים: vs_video)
    - cron: '14 12 * * *'
    # 2. 17:25 UTC -> 13:25 EDT (20:25 ישראל) - באמצע המסחר (vs_video)
    - cron: '25 17 * * *'
    # 3. 21:21 UTC -> 17:21 EDT (00:21 ישראל) - סגירת מסחר (daily_summery בימי מסחר)
    - cron: '21 21 * * *'
    # 4. 22:25 UTC -> 18:25 EDT (01:25 ישראל) - לאחר סגירת מסחר (חוזר ל-vs_video)
    - cron: '25 22 * * *'

  workflow_dispatch:
    inputs:
      video_type:
        description: 'בחר סוג סרטון להרצה ידנית'
        required: true
        default: 'vs_video'
        type: choice
        options:
          - vs_video
          - daily_summery
          - weekly_summery

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium
      - name: Trigger Streamlit App
        run: |
          python -c "
          import os
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from playwright.sync_api import sync_playwright

          # 1. בדיקה אם יש אינפוט מהפעלה ידנית
          manual_input = '${{ github.event.inputs.video_type }}'
          if manual_input:
              video_type = manual_input
          else:
              # 2. בדיקת זמנים לפי שעון ניו יורק (ET)
              now_et = datetime.now(ZoneInfo('America/New_York'))
              weekday = now_et.weekday()  # 0=Mon, 1=Tue, 2=Wed, 3=Thu, 4=Fri, 5=Sat, 6=Sun

              is_trading_day = weekday < 5                  # שני עד שישי
              is_sunday = weekday == 6                      # יום ראשון ב-NY
              is_morning_run = 6 <= now_et.hour <= 9        # הרצת הבוקר (08:14 NY)
              is_close_run = now_et.hour == 17              # הרצת סגירת המסחר בלבד (17:21 NY)

              # קביעת סוג הסרטון
              if is_trading_day and is_close_run:
                  video_type = 'daily_summery'
              elif is_sunday and is_morning_run:
                  video_type = 'weekly_summery'
              else:
                  video_type = 'vs_video'

          url = f'https://slack-ai-agent-xt3nrfdfzjxsupyxdlncnm.streamlit.app/?WEBHOOK_TOKEN=${{ secrets.WEBHOOK_TOKEN }}&video_type={video_type}'
          print(f'🚀 Opening {url} (Type: {video_type}) in Headless Chrome...')

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(url)
              time.sleep(15)
              print(f'✅ Page triggered successfully for {video_type}!')
          "
