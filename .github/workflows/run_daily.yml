name: Trigger Streamlit Webhook 2x Daily

on:
  schedule:
    # 1. 12:14 UTC -> 08:14 EDT (15:14 ישראל) - בוקר: Short (vs_video / weekly_summery ביום ראשון)
    - cron: '14 12 * * *'
    # 2. 21:21 UTC -> 17:21 EDT (00:21 ישראל) - סגירת מסחר: Long Form (daily_summery)
    - cron: '21 21 * * *'

  workflow_dispatch:
    inputs:
      video_type:
        description: 'בחר סוג סרטון להרצה ידנית'
        required: true
        default: 'vs_video'
        type: choice
        options:
          - vs_video
          - daily_summery
          - weekly_summery

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium
      - name: Trigger Streamlit App
        run: |
          python -c "
          import os
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from playwright.sync_api import sync_playwright

          manual_input = '${{ github.event.inputs.video_type }}'
          if manual_input:
              video_type = manual_input
          else:
              now_et = datetime.now(ZoneInfo('America/New_York'))
              weekday = now_et.weekday()

              is_trading_day = weekday < 5
              is_sunday = weekday == 6
              is_morning_run = 6 <= now_et.hour <= 9

              if is_trading_day and not is_morning_run:
                  video_type = 'daily_summery'
              elif is_sunday and is_morning_run:
                  video_type = 'weekly_summery'
              else:
                  video_type = 'vs_video'

          url = f'https://slack-ai-agent-xt3nrfdfzjxsupyxdlncnm.streamlit.app/?WEBHOOK_TOKEN=${{ secrets.WEBHOOK_TOKEN }}&video_type={video_type}'
          print(f'🚀 Opening {url} (Type: {video_type}) in Headless Chrome...')

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(url)
              time.sleep(15)
              print(f'✅ Page triggered successfully for {video_type}!')
          "
