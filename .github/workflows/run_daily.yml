name: Run Stock Video Generator 3x Daily

on:
  # תזמון אוטומטי בימי שני-שישי (ימי מסחר)
  schedule:
    # 1. 15:00 שעון ישראל (12:00 UTC) - Pre-market
    - cron: '0 12 * * 1-5'
    
    # 2. 19:30 שעון ישראל (16:30 UTC) - Mid-day
    - cron: '30 16 * * 1-5'
    
    # 3. 23:30 שעון ישראל (20:30 UTC) - Market Close
    - cron: '30 20 * * 1-5'

  # מאפשר הרצה ידנית בלחיצת כפתור מתוך GitHub כשבא לך
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Main Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_PICKLE_BASE64: ${{ secrets.YOUTUBE_TOKEN_PICKLE_BASE64 }}
        run: python main.py
