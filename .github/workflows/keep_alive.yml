name: Streamlit Keep Alive (Playwright Ping)

on:
  schedule:
    # מריץ את הסקריפט כל 10 דקות לשמירה על שרת חם ברציפות
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Send Playwright Keep-Alive Ping
        run: |
          python -c "
          import time
          from playwright.sync_api import sync_playwright

          url = 'https://slack-ai-agent-xt3nrfdfzjxsupyxdlncnm.streamlit.app/?WEBHOOK_TOKEN=${{ secrets.WEBHOOK_TOKEN }}&video_type=ping'
          print('🚀 Sending Playwright Ping to Streamlit app...')

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              
              # פתיחת הקישור
              page.goto(url)
              
              # המתנה של 15 שניות כדי לוודא ש-Streamlit טען את ה-WebSocket והתעורר לגמרי
              time.sleep(15)
              print('✅ Keep-Alive Ping executed successfully!')
          "
